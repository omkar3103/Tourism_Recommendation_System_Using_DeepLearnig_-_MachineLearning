<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tourism Recommendation System - Discover Your Journey</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      color: #fff;
      position: relative;
      scroll-behavior: smooth;
    }

    /* Professional Animated Background */
    .background-wrapper {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 25%, #2c5364 50%, #1a3a52 75%, #0f2027 100%);
      background-size: 400% 400%;
      animation: professionalGradient 20s ease infinite;
    }

    @keyframes professionalGradient {
      0% { background-position: 0% 50%; }
      25% { background-position: 100% 25%; }
      50% { background-position: 100% 75%; }
      75% { background-position: 0% 100%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating Geometric Elements */
    .geometric-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }

    .geo-element {
      position: absolute;
      background: linear-gradient(45deg, rgba(0, 198, 255, 0.1), rgba(0, 114, 255, 0.05));
      border: 1px solid rgba(255, 255, 255, 0.05);
      animation: floatGeo 25s infinite ease-in-out;
    }

    .geo-element:nth-child(1) {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      top: 10%;
      left: -150px;
      animation-delay: 0s;
    }

    .geo-element:nth-child(2) {
      width: 200px;
      height: 200px;
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
      top: 60%;
      right: -100px;
      animation-delay: 5s;
    }

    .geo-element:nth-child(3) {
      width: 150px;
      height: 150px;
      transform: rotate(45deg);
      bottom: 20%;
      left: 10%;
      animation-delay: 10s;
    }

    @keyframes floatGeo {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(30px, -40px) rotate(90deg); }
      50% { transform: translate(-20px, 30px) rotate(180deg); }
      75% { transform: translate(40px, 20px) rotate(270deg); }
    }

    /* Particle System */
    .particles {
      position: fixed;
      inset: 0;
      z-index: -1;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 198, 255, 0.5);
      animation: particleFloat 15s infinite linear;
    }

    @keyframes particleFloat {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
        transform: translateY(90vh) scale(1);
      }
      90% {
        opacity: 1;
        transform: translateY(10vh) scale(1);
      }
      100% {
        transform: translateY(0) scale(0);
        opacity: 0;
      }
    }

    /* Video Background */
    .video-container {
      position: fixed;
      inset: 0;
      z-index: -3;
      opacity: 0.3;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Professional Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(15, 32, 39, 0.85) 0%,
        rgba(32, 58, 67, 0.75) 50%,
        rgba(44, 83, 100, 0.65) 100%
      );
      z-index: -1;
    }

    /* Hero Section */
    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      position: relative;
      min-height: 100vh; /* Make page taller to enable scrolling */
    }

    /* Additional Sections for Scroll */
    .features-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      position: relative;
      background: linear-gradient(
        180deg,
        rgba(15, 32, 39, 0.95) 0%,
        rgba(44, 83, 100, 0.85) 100%
      );
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 40px;
      max-width: 1200px;
      width: 100%;
    }

    .feature-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 198, 255, 0.3);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .feature-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(0, 198, 255, 0.2),
        transparent
      );
      transition: left 0.6s;
    }

    .feature-card:hover::before {
      left: 100%;
    }

    .feature-card:hover {
      transform: translateY(-10px) scale(1.05);
      box-shadow: 0 20px 40px rgba(0, 198, 255, 0.3);
      border-color: rgba(0, 198, 255, 0.5);
    }

    .feature-icon {
      font-size: 3rem;
      color: #00c6ff;
      margin-bottom: 20px;
      display: block;
    }

    .feature-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: #ffffff;
    }

    .feature-description {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
    }

    /* Professional Card Design */
    .glass-card {
      max-width: 800px;
      width: 100%;
      padding: 60px 50px;
      border-radius: 28px;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.15) 0%,
        rgba(0, 198, 255, 0.08) 50%,
        rgba(255, 255, 255, 0.05) 100%
      );
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 2px solid rgba(0, 198, 255, 0.3);
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.4),
        0 0 100px rgba(0, 198, 255, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        inset 0 -1px 0 rgba(0, 198, 255, 0.1);
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: cardEntry 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.1),
        transparent
      );
      animation: cardShimmer 4s infinite;
    }

    @keyframes cardEntry {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes cardShimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /* Typography */
    .glass-card h1 {
      font-size: 3.2rem;
      font-weight: 700;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #ffffff 0%, #00c6ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 4px 20px rgba(0, 198, 255, 0.3);
      position: relative;
      z-index: 1;
    }

    .glass-card .subtitle {
      font-size: 1.2rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 40px;
      line-height: 1.7;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      position: relative;
      z-index: 1;
    }

    /* CTA Button inside card */
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 18px 45px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        0 15px 35px rgba(0, 114, 255, 0.4),
        0 0 60px rgba(0, 198, 255, 0.2);
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .cta-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.3),
        transparent
      );
      transition: left 0.6s;
    }

    .cta-btn:hover::before {
      left: 100%;
    }

    .cta-btn:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 
        0 25px 50px rgba(0, 114, 255, 0.6),
        0 0 80px rgba(0, 198, 255, 0.3);
      background: linear-gradient(135deg, #00d4ff 0%, #0080ff 100%);
    }

    .cta-btn:active {
      transform: translateY(-2px) scale(1.01);
    }

    /* Feature Pills */
    .features {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 50px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .feature-pill {
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .feature-pill:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    .feature-pill i {
      color: #00c6ff;
    }

    /* Minimal Scroll Indicator */
    .scroll-indicator {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      animation: bounce 2s infinite;
      z-index: 1000;
      padding: 12px 20px;
      border-radius: 30px;
      transition: all 0.3s ease;
    }

    .scroll-indicator:hover {
      transform: translateX(-50%) scale(1.02);
    }

    .scroll-indicator span {
      font-size: 0.75rem;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .scroll-indicator i {
      font-size: 1.2rem;
      color: #00c6ff;
      text-shadow: 0 3px 10px rgba(0, 198, 255, 0.6);
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
      40% { transform: translateX(-50%) translateY(-8px); }
      60% { transform: translateX(-50%) translateY(-4px); }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .glass-card {
        padding: 40px 30px;
      }
      
      .glass-card h1 {
        font-size: 2.2rem;
      }
      
      .glass-card .subtitle {
        font-size: 1rem;
      }
      
      .cta-btn {
        padding: 15px 35px;
        font-size: 1rem;
      }
      
      .features {
        flex-direction: column;
        align-items: center;
      }
      
      .feature-pill {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <!-- Professional Background Layers -->
  <div class="background-wrapper"></div>
  <div class="geometric-bg">
    <div class="geo-element"></div>
    <div class="geo-element"></div>
    <div class="geo-element"></div>
  </div>
  <div class="particles" id="particles"></div>
  
  <!-- Video Background -->
  <div class="video-container">
    <video autoplay loop muted>
      <source src="{{ url_for('static', filename='Tourism Agency Logo Advert.mp4') }}" type="video/mp4">
    </video>
  </div>

  <!-- Professional Overlay -->
  <div class="overlay"></div>

  <!-- Hero Section -->
  <section class="hero">
    <div class="glass-card">
      <h1>Discover Your Perfect Journey</h1>
      <p class="subtitle">
        Experience intelligent tourism recommendations tailored to your preferences, 
        powered by advanced algorithms that understand your travel style and 
        deliver unforgettable destinations worldwide.
      </p>
      
      <a href="/recommendation" class="cta-btn">
        <i class="fas fa-compass"></i>
        Start Your Journey
      </a>
    </div>
  </section>

  <!-- Scroll Indicator -->
  <div class="scroll-indicator" onclick="window.location.href='/recommendation.html'">
    <span>Scroll to Continue</span>
    <i class="fas fa-chevron-down"></i>
  </div>

  <script>
    // Generate particles
    function createParticles() {
      const container = document.getElementById('particles');
      const particleCount = 40;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
        
        container.appendChild(particle);
      }
    }

    // Enhanced scroll functionality - improved detection
    window.addEventListener('scroll', () => {
      const scrolled = window.pageYOffset;
      const windowHeight = window.innerHeight;
      const documentHeight = document.documentElement.scrollHeight;
      
      // Debug logging
      console.log('Scroll event fired!', 'Scrolled:', scrolled, 'Window height:', windowHeight, 'Document height:', documentHeight);
      
      // Redirect when user scrolls down (any scroll movement)
      if (scrolled > 10) {
        console.log('Scroll threshold met, redirecting to recommendation page...');
        document.body.style.background = 'linear-gradient(135deg, #0f2027 0%, #203a43 25%, #2c5364 50%, #1a3a52 75%, #0f2027 100%)';
        document.body.style.opacity = '0';
        document.body.style.transition = 'opacity 0.6s ease';
        setTimeout(() => {
          window.location.href = '/recommendation.html';
        }, 600);
      }
      
      // Parallax effect
      const parallax = document.querySelector('.geo-element');
      if (parallax) {
        const speed = 0.5;
        parallax.style.transform = `translateY(${scrolled * speed}px)`;
      }
    });

    // Also add wheel event as backup
    window.addEventListener('wheel', (e) => {
      console.log('Wheel event detected, redirecting...');
      document.body.style.background = 'linear-gradient(135deg, #0f2027 0%, #203a43 25%, #2c5364 50%, #1a3a52 75%, #0f2027 100%)';
      document.body.style.opacity = '0';
      document.body.style.transition = 'opacity 0.6s ease';
      setTimeout(() => {
        window.location.href = '/recommendation.html';
      }, 600);
    });

    // Fallback: Also redirect on click if scroll doesn't work
    document.addEventListener('click', (e) => {
      if (e.target.closest('.scroll-indicator')) {
        console.log('Scroll indicator clicked, redirecting...');
        window.location.href = '/recommendation.html';
      }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', createParticles);

    // Add parallax effect on mouse move
    document.addEventListener('mousemove', (e) => {
      const mouseX = e.clientX / window.innerWidth;
      const mouseY = e.clientY / window.innerHeight;
      
      const geoElements = document.querySelectorAll('.geo-element');
      geoElements.forEach((element, index) => {
        const speed = (index + 1) * 20;
        const x = (mouseX - 0.5) * speed;
        const y = (mouseY - 0.5) * speed;
        element.style.transform = `translate(${x}px, ${y}px)`;
      });
    });
  </script>
</body>
</html>
